# Banco PostgreSQL para desenvolvimento local. As credenciais vêm do arquivo .env (fora do Git);
# copie .env.example para .env e ajuste os valores. Uma única instância e um único container abrigam
# os bancos de todos os serviços; POSTGRES_USER/POSTGRES_PASSWORD são a credencial ADMINISTRATIVA da
# instância e nunca são usadas por APIs ou workers.
name: ouroboros

services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: ouroboros-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?defina RABBITMQ_ADMIN_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?defina RABBITMQ_ADMIN_PASSWORD no .env}
      RABBITMQ_DEFAULT_VHOST: ouroboros
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Provisiona bancos e roles por serviço (scripts/database). Só roda por comando explícito, nunca na
  # subida das APIs nem em `docker compose up`:
  #   docker compose --profile provision run --rm provision-databases
  # É idempotente e funciona em volume novo ou existente. As senhas dos serviços vêm do .env.
  provision-databases:
    image: postgres:18-alpine
    profiles: ["provision"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - ./scripts/database:/scripts:ro
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/scripts/provision.sql"]

  # Transfere o schema identity do banco original para o banco próprio do serviço (scripts/database/transfer-identity.sh),
  # em etapas explícitas e com backup, validação e retorno. Nunca roda em `docker compose up`:
  #   docker compose --profile transfer run --rm transfer-identity <freeze|backup|copy|validate|cutover|rollback|reconcile|unfreeze> [id]
  # Os backups ficam em ./backups (fora do Git).
  transfer-identity:
    image: postgres:18-alpine
    profiles: ["transfer"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      SOURCE_DATABASE: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      TRANSFER_DIR: /backups
    volumes:
      - ./scripts/database:/scripts:ro
      - ./backups:/backups
    entrypoint: ["bash", "/scripts/transfer-identity.sh"]

  # Diagnósticos (OpenTelemetry). As APIs e os workers enviam OTLP/HTTP ao coletor em 127.0.0.1:4318 quando
  # Observability:Otlp:Endpoint está configurado; o coletor sanitiza de novo e encaminha ao destino dedicado,
  # que grava arquivos rotacionados no volume diagnostics-data. Nenhum deles acessa os bancos de negócio.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./config/observability/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_PORT:-4318}:4318"
    depends_on:
      - diagnostics-store

  diagnostics-store:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/diagnostics-store.yaml"]
    environment:
      GOMEMLIMIT: 120MiB
    mem_limit: 160m
    volumes:
      - ./config/observability/diagnostics-store.yaml:/etc/otelcol/diagnostics-store.yaml:ro
      - diagnostics-data:/var/lib/ouroboros-diagnostics
    depends_on:
      diagnostics-volume-init:
        condition: service_completed_successfully

  # O coletor roda como o usuário sem privilégios 10001; o volume novo nasce do root. Ajusta só o dono do volume.
  diagnostics-volume-init:
    image: busybox:1.37.0
    restart: "no"
    command: ["sh", "-c", "chown 10001:10001 /data && chmod 0750 /data"]
    volumes:
      - diagnostics-data:/data

volumes:
  postgres-data:
  rabbitmq-data:
  diagnostics-data:
